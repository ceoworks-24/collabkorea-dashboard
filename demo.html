<style>
:root{--p:#6E4AFF;--pd:#4A2FD6;--tint:#EFEBFF;--tint2:#F3EFFF;--ink:#17142B;--mut:#5E5B78;--line:#ECEDF2;--bg:#F1F2F5;--lv:#B9A8FF;--lvt:#8566F2;--red:#A4271A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-variant-numeric:tabular-nums;font-size:15px}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{margin:0}
header.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 32px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px}
.brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700}
.brand img{width:36px;height:36px;border-radius:9px}
nav{display:flex;gap:4px;flex:1}
nav button{padding:9px 16px;border:0;border-radius:8px;font-size:15px;font-weight:500;color:var(--mut);background:transparent}
nav button.on{background:var(--tint);color:var(--pd);font-weight:700}
.kbar{position:sticky;top:0;z-index:60;background:#17142B;color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px;line-height:1.4}.kbar .btn{flex:none;background:#fff;border-color:#fff;color:var(--pd)}
.ttl{font-size:22px;padding:0 4px;white-space:nowrap}
.userbox{display:flex;align-items:center;gap:10px}.wn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.who{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border:1px solid var(--line);border-radius:24px;font-size:14px}
.av{width:32px;height:32px;border-radius:16px;background:var(--tint);font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;font-weight:700}
.icon{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:#fff;color:var(--mut);display:flex;align-items:center;justify-content:center}
.icon.on{background:var(--tint);color:var(--pd);border-color:#CFC8EE}
.lnk{border:0;background:none;color:var(--mut);font-size:13px;text-decoration:underline}
main{max-width:1520px;margin:0 auto;padding:28px 20px;display:flex;flex-direction:column;gap:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 28px;box-shadow:0 1px 3px rgba(23,20,43,.05);min-width:0}
.card.sm{padding:20px 24px}
button.card{display:flex;flex-direction:column;justify-content:flex-start;font-size:inherit;color:inherit;width:100%}
.lbl{font-size:13px;color:var(--mut)}
.big{font-size:28px;font-weight:700;margin-top:6px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.grow{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:24px;align-items:start}
.btn{height:44px;padding:0 20px;border-radius:10px;border:1px solid #B9B4D6;background:#fff;font-size:15px;font-weight:700;color:var(--ink)}
.btn.p{background:var(--p);border-color:var(--p);color:#fff}
.btn.d{color:var(--red)}
.btn.s{height:36px;padding:0 14px;font-size:14px}
.hcols .seg button{padding:0 10px;height:32px;font-size:13px}.hcols .hside .grid.g2 .hlc{padding:0 14px;height:68px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center}.hcols .hside .hlc>div:last-child{font-size:19px!important}.tots{display:flex;gap:12px;margin-top:18px}.tots .tt{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:0 18px;height:68px;box-sizing:border-box;white-space:nowrap}.tots .sw{width:12px;height:12px;border-radius:4px;flex:none}.tots small{align-self:center}.tots .tl{font-size:14px;color:var(--mut)}.tots b{font-size:24px;letter-spacing:-.3px;margin-left:auto}.tots small{font-size:14px;color:var(--mut)}html{overflow-y:scroll}.hcols .card>.row{flex-wrap:wrap;gap:8px 6px!important}.hcols .card>.row>.muted,.hcols .card>.row>.seg,.hcols .card>.row>.row{flex:none;white-space:nowrap}.hcols .card>.row .seg button{white-space:nowrap}.hcols .card>.row h1{font-size:19px!important;padding:0 2px!important}.hcols .card>.row .nav{width:30px;height:30px}.seg{display:flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--bg)}
.seg button{padding:0 16px;height:36px;border:0;border-radius:8px;font-size:14px;background:transparent;color:var(--mut);font-weight:500}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(23,20,43,.1);color:var(--ink);font-weight:700}
.nav{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:20px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--mut);font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 12px;border-bottom:1px solid #EFEDF7;white-space:nowrap}
tr.sel td{background:var(--tint2)}
table.rt td.full{}
.card:has(>table){overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}.card.dragging{cursor:grabbing;user-select:none}.card.dragging *{cursor:grabbing!important}
.rt td,.rt th{white-space:normal;overflow-wrap:anywhere;word-break:keep-all}
.rt td.r,.rt th.r{white-space:nowrap}
.rt tr.tot td{border-top:2px solid var(--line)}
.rt td.nw{white-space:nowrap}
.mgrp+.mgrp{border-top:1px solid var(--line)}.mh{width:100%;display:flex;justify-content:space-between;gap:8px;align-items:baseline;background:none;border:0;padding:14px 4px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;text-align:left}.mh{flex-wrap:wrap}.mh span:first-child{white-space:nowrap}.mh span.muted{font-weight:500;font-size:13px}.mh:hover{background:var(--bg,#f6f6fa)}
.card{overflow-wrap:break-word}
.mbox.wide{width:min(640px,100%)}
.lr{display:flex;gap:8px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;background:#FBFAFF}
.lr-in{flex:1;display:grid;gap:8px;min-width:0}
.lr input:not([type=checkbox]){height:40px;font-size:14px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.r3{display:grid;grid-template-columns:1.3fr 1fr .6fr;gap:8px}
.lx{flex:none;width:36px;height:36px;font-size:16px;border-radius:10px}
.chk{flex-direction:row;align-items:center;gap:8px;font-size:13px}.chk input{width:18px;height:18px}
.item{padding:10px 12px;background:var(--bg);border-radius:10px}
.hlc{border-radius:8px}.hcols .hlc{background:var(--bg);border-radius:12px;padding:14px 16px}
.hlx{animation:hlx 1s .45s}
@keyframes hlx{0%,35%{background:#FFE27A;box-shadow:0 0 0 6px #FFE27A}100%{background:transparent;box-shadow:0 0 0 6px transparent}}
button.chip:hover{filter:brightness(.95);text-decoration:underline}
.modal{position:fixed;inset:0;background:rgba(23,20,43,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:80}
.mbox{position:relative;background:#fff;border-radius:16px;border-top:4px solid var(--p);width:min(480px,100%);max-height:92vh;overflow:auto;padding:52px 24px 24px}
.mx{position:absolute;right:12px;top:10px;width:36px;height:36px;font-size:18px;border-radius:18px}
/* ----- 레이아웃: PC 사이드바 / 모바일 하단 탭바 ----- */
.shell{display:flex;min-height:100vh}
.sb{width:248px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:16px 12px;gap:4px;transition:width .15s}
.sb .bt{display:flex;align-items:center;gap:10px;padding:4px 6px 12px}
.sb .bt .brand{flex:1;min-width:0;font-size:15px;gap:10px;cursor:pointer}.sb .bt .brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb .bt .brand img{width:34px;height:34px;border-radius:9px;flex:none}
.sbt{width:32px;height:32px;border:0;background:transparent;border-radius:8px;color:var(--mut);display:flex;align-items:center;justify-content:center;flex:none}.sbt:hover{background:var(--bg)}
.sb .sec{font-size:11px;letter-spacing:.06em;color:#8A87A3;padding:14px 10px 6px}
.sb .it{display:flex;align-items:center;gap:12px;width:100%;height:44px;padding:0 10px;border:0;border-radius:10px;background:transparent;color:#3C3A55;font-size:15px;font-weight:500;text-align:left}
.sb .it:hover{background:var(--bg)}.sb .it.on{background:var(--tint);color:var(--pd);font-weight:700}
.sb .it svg{flex:none}.sb .it .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bdg{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:#E8E8F0;color:#3C3A55;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}.bdg.r{background:#E5484D;color:#fff}
.sb .me{margin-top:auto;border-top:1px solid var(--line);padding:12px 6px 0;display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:10px}
.sb .me .tx{min-width:0;font-size:14px;line-height:1.3}.sb .me .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sb .me .tx span{font-size:12px;color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shell.sbc .sb{width:72px;align-items:center}.shell.sbc .sb .lb,.shell.sbc .sb .tx,.shell.sbc .sb .sec,.shell.sbc .sb .brand span,.shell.sbc .sb .it .bdg{display:none}
.shell.sbc .sb .bt{flex-direction:column;padding:4px 0 12px}.shell.sbc .sb .it{justify-content:center;padding:0;width:48px;position:relative}.shell.sbc .sb .it .dot{display:block}
.it .dot{display:none;position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:5px;background:#E5484D}
.shell.sbc .sb .me{justify-content:center;padding:12px 0 0}
.wrap{flex:1;min-width:0}
.mtop,.tabbar{display:none}
.nbox{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.nbox.un{border-color:#CFC8EE;background:#FBFAFF}.nbox .nd{width:9px;height:9px;border-radius:5px;background:#E5484D;flex:none;margin-top:7px}.nbox .nd.off{background:transparent}
.nbox .tx{flex:1;min-width:0;line-height:1.55;overflow-wrap:anywhere}.nbox .mt{font-size:12px;color:var(--mut);margin-top:2px}
.qk{display:flex;flex-wrap:wrap;gap:8px}.qk button{height:36px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:18px;font-size:13px;color:#3C3A55}
textarea{height:auto;min-height:88px;padding:10px 12px;line-height:1.5;resize:vertical}
.pd{height:40px!important;font-size:14px!important}
@media(max-width:700px){
.sb{display:none}.shell{display:block}
.mtop{display:flex;align-items:center;gap:10px;padding:14px 16px 0;position:sticky;top:0;background:var(--bg);z-index:30}.mtop h1{font-size:19px;flex:1}.mtop .av{width:34px;height:34px;font-size:21px;border:1px solid var(--line);background:#fff}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 4px 20px rgba(23,20,43,.12);padding:6px 4px;z-index:50}
.tabbar button{position:relative;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;height:52px;justify-content:center;font-size:11px;color:#6B6788;font-weight:500;border-radius:14px}
.tabbar button.on{color:var(--pd);font-weight:700}.tabbar .bdg{position:absolute;top:2px;left:50%;margin-left:6px;min-width:18px;height:18px;font-size:11px;padding:0 5px}
body{padding-bottom:96px}
main{padding:12px 16px 24px}
.hd{margin-top:-4px}.ttl.pc{display:none}
}
/* ---- 2단 레이아웃 · 공지/알림 ---- */
.cols2{display:grid;grid-template-columns:400px minmax(0,1fr);gap:20px;align-items:start}
.cols2 .side{position:sticky;top:20px;min-width:0}.cols2 .side.stack{display:flex;flex-direction:column}
@media(min-width:961px){.cols2.rside{grid-template-columns:minmax(0,1fr) 400px}.cols2.rside .side{order:2}.cols2.one{grid-template-columns:minmax(0,1fr)}}
@media(max-width:960px){.cols2,.cols2.rside{grid-template-columns:minmax(0,1fr)}.cols2 .side{position:static}}
.nimg{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}.nimg img{max-width:100%;max-height:320px;border-radius:12px;border:1px solid var(--line);cursor:zoom-in;display:block}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}.thumbs .th{position:relative}.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:11px;border:0;background:#111;color:#fff;font-size:12px;line-height:1}
.chk{display:flex!important;flex-direction:row!important;align-items:center;gap:10px;font-size:15px;cursor:pointer}.chk input{width:20px;height:20px;flex:none;accent-color:#111}
/* 상단 고정 · 알림함 색 */
.card.hl{box-shadow:0 0 0 3px #CFC8EE}
.y2,.mcbtn,.mcx{display:none}.tots .tv{margin-left:auto;display:flex;align-items:baseline;gap:2px;white-space:nowrap}.tots .tv b{margin-left:0}
@media(max-width:700px){

/* ---- 레퍼런스 톤: 중립 흰색 사이드바/카드 ---- */
.sb{margin:0;height:100vh;top:0;border:0;border-right:1px solid var(--line);border-radius:0;box-shadow:none}
.sb .it{color:#33323F;font-weight:500;height:42px}.sb .it:hover{background:#F4F4F7}
.sb .it.on{background:#F0F0F4;color:#111;font-weight:700}
.sb .it svg{color:#5A5868}.sb .it.on svg{color:#111}
.sb .sec{font-size:11.5px;color:#9A98AB;letter-spacing:.04em;padding:16px 10px 6px}
.sb .me{margin:auto -4px 0;padding:12px 10px;border-top:1px solid var(--line);border-radius:12px;position:relative}
.sb .me:hover,.sb .me.on{background:#F4F4F7}.sb .me .gear{margin-left:auto;color:#5A5868;display:flex;flex:none}.sb .me .tx{flex:1}
.shell.sbc .sb .me .gear{display:none}.shell.sbc .sb{width:76px}
.card{border-radius:20px;border-color:var(--line);box-shadow:none}
.uc{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 6px;border-radius:15px;background:#F0F0F4;color:#33323F;font-size:13px;font-weight:500;border:0;white-space:nowrap}
.uc i{font-style:normal;font-size:17px;line-height:1}
.uc.ok{background:#E3F5EA;color:#14693B}.uc.no{background:#fff;color:#8A87A3;border:1px dashed #D5D3E0}
.uc.pk{border:1px solid var(--line);background:#fff;height:36px;font-size:14px;cursor:pointer}.uc.pk.on{background:#111;color:#fff;border-color:#111}
.ucs{display:flex;flex-wrap:wrap;gap:6px}
.ackb{background:#FAFAFC;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.okb{font-size:13px;color:#14693B;font-weight:700}
.card.nt.un{background:#fff}
.sb .bdg.r,.tabbar .bdg{background:#E5484D}

.tabbar{border-radius:24px;border-color:var(--line)}
.tabbar button{color:#8A87A3}.tabbar button.on{color:#111;font-weight:700}
.mtop .gb{width:40px;height:40px;border:0;background:#fff;border-radius:20px;color:#33323F;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(23,20,43,.08)}
.card{border-radius:20px}
}
@media(max-width:700px){.hd{gap:6px}.hd .row{gap:2px!important}.hd .nav{width:32px;height:32px;font-size:18px}.hd .ttl{padding:0 2px}.hd .btn{height:40px;padding:0 9px;font-size:14px}table.rt thead{display:none}table.rt,table.rt tbody{display:block}table.rt tr{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:14px 4px;border-bottom:1px solid var(--line)}table.rt td{display:block;border:0;padding:0;white-space:normal;text-align:left!important}table.rt td::before{content:attr(data-l);display:block;font-size:11px;color:var(--mut);font-weight:400}table.rt td.full,table.rt td[colspan]{grid-column:1/-1}table.rt tr.sel{background:var(--tint2)}}

hr{border:0;border-top:1px solid var(--line);margin:28px 0 24px}
.muted{color:var(--mut);font-size:14px}
aside.panel{background:#fff;border:1px solid #CFC8EE;border-top:4px solid var(--p);border-radius:16px;padding:24px;box-shadow:0 4px 16px rgba(110,74,255,.1);min-width:0}
.stack{display:flex;flex-direction:column;gap:20px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:14px}.kv>span:nth-child(odd){color:var(--mut)}

.calc{background:var(--tint2);border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.7}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut);font-weight:500}
input,select,textarea{height:44px;border:1px solid #B9B4D6;border-radius:10px;padding:0 12px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff;width:100%}
.hist div{display:flex;gap:12px;font-size:14px;margin-bottom:8px}.hist span:first-child{color:var(--mut);min-width:44px}
.logs{font-size:13px;color:var(--mut);line-height:1.8}

.line.t{padding-top:10px;border-top:1px solid #EFEDF7;font-weight:700}

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Number(n || 0).toLocaleString('en-US');
const num = s => Number(String(s ?? '').replace(/[^0-9.\-]/g, '')) || 0;
const pad = n => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const NOW = new Date(), CY = NOW.getFullYear(), CM = NOW.getMonth() + 1;
const ymOf = (y, m) => y + '-' + pad(m), CUR = ymOf(CY, CM);
const md = () => pad(CM) + '/' + pad(NOW.getDate());
const shift = (ym, k) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + k, 1); return ymOf(d.getFullYear(), d.getMonth() + 1); };
const ymLabel = ym => ym.slice(0, 4) + '년 ' + Number(ym.slice(5)) + '월';
const ymHd = ym => `<span class="y4">${ym.slice(0, 4)}</span><span class="y2">${ym.slice(2, 4)}</span>년 ${Number(ym.slice(5))}월`;
const sum = (a, k) => (a || []).reduce((s, x) => s + num(x[k]), 0);

  invite: async () => { const f = $('#inv').elements, email = f.email.value.trim().toLowerCase(); if (!/^\S+@\S+\.\S+$/.test(email)) return toast('이메일을 확인해 주세요'); await put('members', email, { email, name: '', role: f.role.value, joined: false }); await log('멤버 초대 ' + email, '', '설정'); toast('초대했습니다. 앱 주소를 알려 주세요'); },
  shareNote: async v => {
    const x = S.notes.find(n => n.id === v); if (!x) return;
    const url = location.origin + location.pathname + '?n=' + x.id, touch = window.matchMedia && window.matchMedia('(max-width:700px), (pointer:coarse)').matches;
    const body = String(x.text || '').replace(/\s+/g, ' ').trim(), part = body.length > 70 ? body.slice(0, 70) + '...' : body;

  },

const csv = rows => '﻿' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: (type || 'text/csv') + ';charset=utf-8' })); a.download = name; a.click(); }

document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t || !H[t.dataset.act]) return; ui.modalPending = false; H[t.dataset.act](t.dataset.v, t, e); });

const shrink = f => new Promise((ok, no) => { const r = new FileReader(); r.onerror = no; r.onload = () => { const im = new Image(); im.onerror = no; im.onload = () => { const k = Math.min(1, 1000 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', .72)); }; im.src = r.result; }; r.readAsDataURL(f); });
document.addEventListener('change', async e => {
  const t = e.target;

  if (t.dataset && t.dataset.chg === 'nimg') { keepNote(); const imgs = ui.nd.imgs || (ui.nd.imgs = []); for (const f of [...t.files]) { if (imgs.length >= 3) break; try { imgs.push(await shrink(f)); } catch (e) { toast('이미지를 불러오지 못했습니다'); } } render(); }
  if (t.dataset && t.dataset.chg === 'role') { const m = S.members.find(x => x.id === t.dataset.email); await put('members', m.id, { ...m, role: t.value }); await log(`${m.email} 권한 → ${t.value === 'admin' ? '관리자' : '멤버'}`, '', '설정'); toast('권한을 바꿨습니다'); }
});

(function(){let d=null,moved=false;
document.addEventListener('mousedown',e=>{if(e.button!==0)return;const c=e.target.closest('.card');if(!c||c.scrollWidth<=c.clientWidth+1||e.target.closest('input,select,textarea'))return;d={c,x:e.clientX,l:c.scrollLeft};moved=false;});
document.addEventListener('mousemove',e=>{if(!d)return;const dx=e.clientX-d.x;if(!moved&&Math.abs(dx)>5){moved=true;d.c.classList.add('dragging');}if(moved)d.c.scrollLeft=d.l-dx;});
const end=()=>{if(d){d.c.classList.remove('dragging');d=null;}};
document.addEventListener('mouseup',end);document.addEventListener('mouseleave',end);
document.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false;}},true);
})();
