<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>㈜콜라브코리아 운영 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--p:#6E4AFF;--pd:#4A2FD6;--tint:#EFEBFF;--tint2:#F3EFFF;--ink:#17142B;--mut:#5E5B78;--line:#E6E3F3;--bg:#F6F5FB;--lv:#B9A8FF;--lvt:#8566F2;--red:#A4271A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-variant-numeric:tabular-nums;font-size:15px}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{margin:0}
header.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 32px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px}
.brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700}
.brand img{width:36px;height:36px;border-radius:9px}
nav{display:flex;gap:4px;flex:1}
nav button{padding:9px 16px;border:0;border-radius:8px;font-size:15px;font-weight:500;color:var(--mut);background:transparent}
nav button.on{background:var(--tint);color:var(--pd);font-weight:700}
.userbox{display:flex;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border:1px solid var(--line);border-radius:24px;font-size:14px}
.av{width:32px;height:32px;border-radius:16px;background:var(--tint);font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;font-weight:700}
.icon{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:#fff;color:var(--mut);display:flex;align-items:center;justify-content:center}
.icon.on{background:var(--tint);color:var(--pd);border-color:#CFC8EE}
.lnk{border:0;background:none;color:var(--mut);font-size:13px;text-decoration:underline}
main{max-width:1216px;margin:0 auto;padding:32px;display:flex;flex-direction:column;gap:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 28px;box-shadow:0 1px 3px rgba(23,20,43,.05);min-width:0}
.card.sm{padding:20px 24px}
button.card{display:flex;flex-direction:column;justify-content:flex-start;font-size:inherit;color:inherit;width:100%}
.lbl{font-size:13px;color:var(--mut)}
.big{font-size:28px;font-weight:700;margin-top:6px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.grow{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:24px;align-items:start}
.btn{height:44px;padding:0 20px;border-radius:10px;border:1px solid #B9B4D6;background:#fff;font-size:15px;font-weight:700;color:var(--ink)}
.btn.p{background:var(--p);border-color:var(--p);color:#fff}
.btn.d{color:var(--red)}
.btn.s{height:36px;padding:0 14px;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--bg)}
.seg button{padding:0 16px;height:36px;border:0;border-radius:8px;font-size:14px;background:transparent;color:var(--mut);font-weight:500}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(23,20,43,.1);color:var(--ink);font-weight:700}
.nav{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:20px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--mut);font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 12px;border-bottom:1px solid #EFEDF7;white-space:nowrap}
tr.sel td{background:var(--tint2)}
table.rt td.full{}
.card:has(>table){overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}.card.dragging{cursor:grabbing;user-select:none}.card.dragging *{cursor:grabbing!important}
.rt td,.rt th{white-space:normal;overflow-wrap:anywhere;word-break:keep-all}
.rt td.r,.rt th.r{white-space:nowrap}
.rt tr.tot td{border-top:2px solid var(--line)}
.card{overflow-wrap:break-word}
.mbox.wide{width:min(640px,100%)}
.lr{display:flex;gap:8px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;background:#FBFAFF}
.lr-in{flex:1;display:grid;gap:8px;min-width:0}
.lr input:not([type=checkbox]){height:40px;font-size:14px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.r3{display:grid;grid-template-columns:1.3fr 1fr .6fr;gap:8px}
.lx{flex:none;width:36px;height:36px;font-size:16px;border-radius:10px}
.chk{flex-direction:row;align-items:center;gap:8px;font-size:13px}.chk input{width:18px;height:18px}
.item{padding:10px 12px;background:var(--bg);border-radius:10px}
.hlc{border-radius:8px}
.hlx{animation:hlx 1s .45s}
@keyframes hlx{0%,35%{background:#FFE27A;box-shadow:0 0 0 6px #FFE27A}100%{background:transparent;box-shadow:0 0 0 6px transparent}}
button.chip:hover{filter:brightness(.95);text-decoration:underline}
.modal{position:fixed;inset:0;background:rgba(23,20,43,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.mbox{position:relative;background:#fff;border-radius:16px;border-top:4px solid var(--p);width:min(480px,100%);max-height:92vh;overflow:auto;padding:52px 24px 24px}
.mx{position:absolute;right:12px;top:10px;width:36px;height:36px;font-size:18px;border-radius:18px}
@media(max-width:700px){table.rt thead{display:none}table.rt,table.rt tbody{display:block}table.rt tr{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:14px 4px;border-bottom:1px solid var(--line)}table.rt td{display:block;border:0;padding:0;white-space:normal;text-align:left!important}table.rt td::before{content:attr(data-l);display:block;font-size:11px;color:var(--mut);font-weight:400}table.rt td.full,table.rt td[colspan]{grid-column:1/-1}table.rt tr.sel{background:var(--tint2)}}
@keyframes hl{0%,45%{background:#FFE27A}100%{background:transparent}}
tr.hl td{animation:hl 1s ease-out}
tr.clk{cursor:pointer}tr.clk:hover td{background:#FAF9FF}
.r{text-align:right}
.chip{display:inline-block;border-radius:12px;padding:4px 10px;font-size:13px;font-weight:500}
hr{border:0;border-top:1px solid var(--line);margin:28px 0 24px}
.muted{color:var(--mut);font-size:14px}
aside.panel{background:#fff;border:1px solid #CFC8EE;border-top:4px solid var(--p);border-radius:16px;padding:24px;box-shadow:0 4px 16px rgba(110,74,255,.1);min-width:0}
.stack{display:flex;flex-direction:column;gap:20px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:14px}.kv>span:nth-child(odd){color:var(--mut)}
.note{background:var(--bg);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6;color:#3C3A55}
.calc{background:var(--tint2);border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.7}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut);font-weight:500}
input,select,textarea{height:44px;border:1px solid #B9B4D6;border-radius:10px;padding:0 12px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff;width:100%}
.hist div{display:flex;gap:12px;font-size:14px;margin-bottom:8px}.hist span:first-child{color:var(--mut);min-width:44px}
.logs{font-size:13px;color:var(--mut);line-height:1.8}
.line{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.line.t{padding-top:10px;border-top:1px solid #EFEDF7;font-weight:700}
.chartwrap{position:relative;height:316px;margin-top:24px}
.tick{position:absolute;left:0;right:0;height:0}.tick span{position:absolute;left:0;top:-8px;width:44px;text-align:right;font-size:12px;color:var(--mut)}.tick i{position:absolute;left:56px;right:0;top:0;border-top:1px solid var(--line)}
.bars{position:absolute;left:56px;right:0;top:0;bottom:0;display:flex;gap:6px}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:transparent;border:0;border-radius:10px;padding:0}
.bar.on{background:#F7F5FF}
.bar .v{font-size:12px;line-height:1.5;text-align:center;font-weight:700;margin-bottom:4px}
.bar .v b{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px}
.bar .pair{display:flex;align-items:flex-end;gap:4px;height:240px}
.bar .pair i{width:20px;border-radius:4px 4px 0 0;display:block}
.bar .nm{height:32px;line-height:32px;font-size:13px;color:var(--mut)}.bar.on .nm{color:var(--ink);font-weight:700}
.sq{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.gs{display:grid;gap:24px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.dash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px dashed #CFC8EE;border-radius:16px;padding:24px;color:var(--mut);text-align:center;background:transparent}
.kpi{font-size:42px;font-weight:700;margin-top:8px;letter-spacing:-.5px}.kpi small{font-size:20px;font-weight:500;color:var(--mut)}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 24px}
.loginbox{width:100%;max-width:440px;display:flex;flex-direction:column;gap:20px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:9}
.tag{font-size:13px;color:#7A5A00;background:#FFF4D6;border-radius:8px;padding:7px 12px}
@media(max-width:960px){.gs{grid-template-columns:1fr}.split{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}main{padding:20px 16px}header.top{padding:10px 16px}.card{padding:20px 16px}.kpi{font-size:32px}}
@media(max-width:560px){.g2,.g4{grid-template-columns:1fr}.bar .pair i{width:8px}}
</style>
</head>

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Number(n || 0).toLocaleString('en-US');
const num = s => Number(String(s ?? '').replace(/[^0-9.\-]/g, '')) || 0;
const pad = n => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const NOW = new Date(), CY = NOW.getFullYear(), CM = NOW.getMonth() + 1;
const ymOf = (y, m) => y + '-' + pad(m), CUR = ymOf(CY, CM);
const md = () => pad(CM) + '/' + pad(NOW.getDate());
const shift = (ym, k) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + k, 1); return ymOf(d.getFullYear(), d.getMonth() + 1); };
const ymLabel = ym => ym.slice(0, 4) + '년 ' + Number(ym.slice(5)) + '월';

};
const csv = rows => '﻿' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: (type || 'text/csv') + ';charset=utf-8' })); a.download = name; a.click(); }
const readProd = () => { const n = [...document.querySelectorAll('[name=pn]')], r = [...document.querySelectorAll('[name=pr]')]; return n.map((el, i) => ({ name: el.value.trim(), rate: num(r[i].value) })); };
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t || !H[t.dataset.act]) return; H[t.dataset.act](t.dataset.v, t, e); });
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (ui.confirm) { confirmFn = null; ui.confirm = null; render(); } else if (ui.modal) closeModalNow(); });
document.addEventListener('input', e => { if (e.target.closest('#form')) { const k = $('#form').dataset.kind; k === 'ad' ? calcAd() : calcLec(); } });
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.name === 'product' && $('#form')) { const o = t.selectedOptions[0]; $('#form').elements.rate.value = o.dataset.rate; calcAd(); }
  if (t.name === 'status' && $('#form') && $('#form').dataset.kind === 'ad') calcAd();
  if (t.dataset && t.dataset.chg === 'role') { const m = S.members.find(x => x.id === t.dataset.email); await put('members', m.id, { ...m, role: t.value }); await log(`${m.email} 권한 → ${t.value === 'admin' ? '관리자' : '멤버'}`, '', '설정'); toast('권한을 바꿨습니다'); }
});
boot();

(function(){let d=null,moved=false;
document.addEventListener('mousedown',e=>{if(e.button!==0)return;const c=e.target.closest('.card');if(!c||c.scrollWidth<=c.clientWidth+1||e.target.closest('input,select,textarea'))return;d={c,x:e.clientX,l:c.scrollLeft};moved=false;});
document.addEventListener('mousemove',e=>{if(!d)return;const dx=e.clientX-d.x;if(!moved&&Math.abs(dx)>5){moved=true;d.c.classList.add('dragging');}if(moved)d.c.scrollLeft=d.l-dx;});
const end=()=>{if(d){d.c.classList.remove('dragging');d=null;}};
document.addEventListener('mouseup',end);document.addEventListener('mouseleave',end);
document.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false;}},true);
})();
</script>
</body>
